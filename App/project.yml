# XcodeGen spec for the iOS app. Generate the Xcode project on a Mac with:
#
#   brew install xcodegen
#   cd App && xcodegen generate && open Cuardach.xcodeproj
#
# The app target is deliberately thin: all logic lives in the Swift package
# at the repository root (CuardachCore, CuardachAR, CuardachUI).

name: Cuardach
options:
  bundleIdPrefix: ie.ncad
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  Cuardach:
    path: ..
  # The single third-party component allowed by the PRD (GLB/glTF import).
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    exactVersion: 0.5.9

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Cuardach:
    type: application
    platform: iOS
    sources:
      - path: Cuardach
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ie.ncad.cuardach
        INFOPLIST_FILE: Cuardach/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Set your team here or in Xcode's Signing & Capabilities tab.
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Cuardach
        product: CuardachCore
      - package: Cuardach
        product: CuardachAR
      - package: Cuardach
        product: CuardachUI
      - package: GLTFKit2
        product: GLTFKit2

  CuardachUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CuardachUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ie.ncad.cuardach.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Cuardach
    dependencies:
      - target: Cuardach

schemes:
  Cuardach:
    build:
      targets:
        Cuardach: all
    test:
      targets:
        - CuardachUITests
